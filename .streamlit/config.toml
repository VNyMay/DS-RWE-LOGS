# Digital Society Casebook - Streamlit theme.
# White surfaces with a deep-green accent (palette adapted from the Secure_Lan / EXVIN design language).

[theme]
base = "light"
primaryColor = "#027554"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f7f5"
textColor = "#0c1f18"
linkColor = "#027554"
borderColor = "#d9e4de"
dataframeBorderColor = "#d9e4de"
dataframeHeaderBackgroundColor = "#f3f7f5"
codeBackgroundColor = "#eef4f1"
font = "'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif"
headingFont = "'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif"
codeFont = "'Cascadia Mono', ui-monospace, Consolas, monospace"
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#027554", "#00946e", "#4fb896", "#9fd3c0", "#56695f"]
chartSequentialColors = ["#e3efe9", "#9fd3c0", "#4fb896", "#027554", "#00523f"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f7f5"
borderColor = "#d9e4de"

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
